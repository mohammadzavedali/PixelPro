<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelPro - Editor Workspace</title>
    <!-- ফন্ট এবং আইকন লোড করার জন্য -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- আমাদের এক্সটার্নাল CSS ফাইল লিংক করা হলো -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- টপ বার -->
    <header class="top-bar">
        <div class="brand-menu">
            <div class="logo">PixelPro</div>
            <div class="menu-items">
                <span>File</span>
                <span>Edit</span>
                <span>Image</span>
                <span>Layer</span>
                <span>Filter</span>
                <span>View</span>
            </div>
        </div>
        <div class="top-actions">
            <!-- এখানে id="undo-btn" এবং id="redo-btn" যোগ করা হয়েছে -->
            <span id="undo-btn" style="margin-right: 15px; cursor: pointer; color: #9ca3af;" title="Undo"><i class="fas fa-undo"></i></span>
            <span id="redo-btn" style="margin-right: 15px; cursor: pointer; color: #9ca3af;" title="Redo"><i class="fas fa-redo"></i></span>
            <button><i class="fas fa-download"></i> Export</button>
        </div>
    </header>

    <!-- মূল কাজের জায়গা -->
    <div class="workspace">
        <!-- বাম দিকের টুলবার -->
        <aside class="left-toolbar">
            <div class="tool-btn active" data-tool="move" title="Move Tool"><i class="fas fa-arrows-alt"></i></div>
            <div class="tool-btn" data-tool="crop" title="Crop Tool"><i class="fas fa-crop-alt"></i></div>
            <div class="tool-btn" data-tool="brush" title="Brush Tool"><i class="fas fa-paint-brush"></i></div>
            <div class="tool-btn" data-tool="eraser" title="Eraser Tool"><i class="fas fa-eraser"></i></div>
            <div class="tool-btn" data-tool="text" title="Text Tool"><i class="fas fa-font"></i></div>
            <div class="tool-btn" data-tool="shapes" title="Shapes Tool (Rectangle)"><i class="fas fa-shapes"></i></div>
            <div class="tool-btn" data-tool="picker" title="Color Picker"><i class="fas fa-eye-dropper"></i></div>
            <div class="tool-btn" data-tool="zoom" title="Zoom In"><i class="fas fa-search"></i></div>
            
            <!-- কালার সিলেক্টর (class ব্যবহার করা হলো) -->
            <input type="color" class="color-picker-input" value="#3b82f6" title="Choose Color">
        </aside>

        <!-- মাঝখানের ক্যানভাস -->
        <main class="canvas-area">
            
            <!-- ফাইল ইনপুট (লুকানো থাকবে) -->
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            
            <!-- ইমপোর্ট বক্স -->
            <div id="import-box" class="import-box" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <p style="font-weight: 500;">Click to Import Photo</p>
            </div>

            <!-- ছবির কন্টেইনার -->
            <div class="image-wrapper" id="image-wrapper">
                <canvas id="editor-canvas"></canvas>
            </div>

        </main>

        <!-- ডান দিকের প্যানেল -->
        <aside class="right-panel">
            <div class="panel-tabs">
                <div class="panel-tab active">Adjustments</div>
                <div class="panel-tab">Layers</div>
            </div>
            
            <div class="panel-content">
                <!-- অ্যাডজাস্টমেন্ট স্লাইডার সমূহ -->
                <div class="adjustment-group">
                    <label><span>Brightness</span> <span>+10</span></label>
                    <input type="range" min="-100" max="100" value="10">
                </div>
                
                <div class="adjustment-group">
                    <label><span>Contrast</span> <span>+25</span></label>
                    <input type="range" min="-100" max="100" value="25">
                </div>
                
                <div class="adjustment-group">
                    <label><span>Saturation</span> <span>0</span></label>
                    <input type="range" min="-100" max="100" value="0">
                </div>
                
                <div class="adjustment-group">
                    <label><span>Blur</span> <span>0px</span></label>
                    <input type="range" min="0" max="50" value="0">
                </div>

                <hr style="border: 0; border-top: 1px solid #374151; margin: 20px 0;">

                <div class="adjustment-group">
                    <label style="color: #3b82f6; font-weight: 600;"><i class="fas fa-magic"></i> Auto Enhance</label>
                </div>
            </div>
        </aside>
    </div>

    <!-- মোবাইলের জন্য বটম টুলবার (সবগুলো টুল দেওয়া হলো) -->
    <nav class="mobile-bottom-bar">
        <div class="tool-btn active" data-tool="move" title="Move Tool"><i class="fas fa-arrows-alt"></i></div>
        <div class="tool-btn" data-tool="crop" title="Crop Tool"><i class="fas fa-crop-alt"></i></div>
        <div class="tool-btn" data-tool="brush" title="Brush Tool"><i class="fas fa-paint-brush"></i></div>
        <div class="tool-btn" data-tool="eraser" title="Eraser Tool"><i class="fas fa-eraser"></i></div>
        <div class="tool-btn" data-tool="text" title="Text Tool"><i class="fas fa-font"></i></div>
        <div class="tool-btn" data-tool="shapes" title="Shapes Tool"><i class="fas fa-shapes"></i></div>
        <div class="tool-btn" data-tool="picker" title="Color Picker"><i class="fas fa-eye-dropper"></i></div>
        
        <!-- মোবাইলের জন্যও একটি কালার সিলেক্টর -->
        <input type="color" class="color-picker-input" value="#3b82f6" title="Choose Color">
    </nav>

    <!-- আমাদের এক্সটার্নাল JavaScript ফাইল লিংক করা হলো -->
    <script src="script.js"></script>
</body>
</html>
